[package]
name = "mage-arena"
version = "0.1.0"
edition = "2021"

[dependencies]
bevy = "0.15"
avian3d = { version = "0.2", features = ["collider-from-mesh"] }
bevy_hanabi = "0.15"
bevy_heightmap = "0.3"
noise = "0.9"
rand = "0.8"

[features]
default = []
dev = ["bevy/dynamic_linking"]

# Faster compile times for development
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
